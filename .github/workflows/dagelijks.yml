# MalKho: draait het script en zet het dashboard en de gegevens voor de app op GitHub Pages.
# Versie 1.4 (27-10-2026)
#  - volledige run: 1x per werkdag na sluiting van de beurs (alles opnieuw berekenen)
#  - lichte run: elk uur tijdens de beurs (alleen de koersen bijwerken)
name: MalKho dagelijks

on:
  schedule:
    # Tijden zijn in UTC. Amsterdam = UTC+1 (wintertijd) of UTC+2 (zomertijd).
    # Volledige run: 17:00 UTC = 18:00 (winter) of 19:00 (zomer), na sluiting om 17:30.
    - cron: "0 17 * * 1-5"
    # Lichte run: elk uur van 08:00 tot en met 16:00 UTC
    # = 09:00–17:00 (winter) of 10:00–18:00 (zomer).
    - cron: "0 8-16 * * 1-5"
  workflow_dispatch:  # knop "Run workflow" om het zelf te starten
    inputs:
      modus:
        description: "Welke run?"
        type: choice
        options: [volledig, licht]
        default: volledig

permissions:
  contents: read
  pages: write
  id-token: write

# Runs wachten op elkaar in plaats van elkaar af te breken
# (anders kan een vertraagde lichte run de volledige run stoppen).
concurrency:
  group: malkho
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiceren.outputs.page_url }}
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakketten installeren
        run: pip install -r requirements.txt

      - name: MalKho draaien
        env:
          MALKHO_UITVOER: site
          # lichte run bij het uurschema, anders de keuze bij "Run workflow" (standaard volledig)
          MALKHO_MODUS: ${{ github.event.schedule == '0 8-16 * * 1-5' && 'licht' || inputs.modus || 'volledig' }}
          MALKHO_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python malkho.py

      - name: Website klaarzetten
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publiceren op GitHub Pages
        id: publiceren
        uses: actions/deploy-pages@v4
